<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300"
     shape-rendering="crispEdges" text-rendering="geometricPrecision">

  <defs>
    <!-- Subtle scanline overlay -->
    <pattern id="scan" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#000000" opacity="0.10"/>
    </pattern>

    <!-- Orange pixel glow (for mascot + title) -->
    <filter id="og" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#CC7A4A" flood-opacity="0.40"/>
    </filter>
    <filter id="ogsm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#CC7A4A" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════
       BACKGROUND  (near-black, like the retro images)
  ═══════════════════════════════════════════════ -->
  <rect width="880" height="300" fill="#0f0f0f"/>
  <rect width="880" height="300" fill="url(#scan)"/>
  <!-- thin amber border -->
  <rect width="880" height="300" fill="none"
        stroke="#CC7A4A" stroke-width="1.2" stroke-opacity="0.22" rx="6"/>

  <!-- ═══════════════════════════════════════════════
       STARS  (scattered dots, like Image 4)
  ═══════════════════════════════════════════════ -->
  <g fill="#d4a06a" opacity="0.65">
    <rect x="42"  y="18"  width="2" height="2"/>
    <rect x="110" y="44"  width="2" height="2"/>
    <rect x="198" y="22"  width="2" height="2"/>
    <rect x="318" y="38"  width="2" height="2"/>
    <rect x="400" y="14"  width="2" height="2"/>
    <rect x="490" y="42"  width="2" height="2"/>
    <rect x="540" y="20"  width="3" height="3"/>
    <rect x="560" y="40"  width="2" height="2"/>
    <rect x="580" y="26"  width="2" height="2"/>
    <rect x="614" y="16"  width="2" height="2"/>
    <rect x="660" y="38"  width="2" height="2"/>
    <rect x="730" y="22"  width="3" height="3"/>
    <rect x="780" y="44"  width="2" height="2"/>
    <rect x="830" y="14"  width="2" height="2"/>
    <rect x="856" y="36"  width="2" height="2"/>
    <rect x="68"  y="52"  width="2" height="2"/>
    <rect x="250" y="56"  width="2" height="2"/>
    <rect x="360" y="60"  width="2" height="2"/>
    <rect x="448" y="52"  width="2" height="2"/>
    <rect x="868" y="58"  width="2" height="2"/>
    <rect x="16"  y="60"  width="2" height="2"/>
  </g>
  <!-- Bright accent stars (slightly larger, like Image 4) -->
  <rect x="88"  y="32"  width="3" height="3" fill="#e8b880" opacity="0.80"/>
  <rect x="276" y="28"  width="3" height="3" fill="#e8b880" opacity="0.80"/>
  <rect x="506" y="34"  width="3" height="3" fill="#e8b880" opacity="0.80"/>
  <rect x="696" y="28"  width="3" height="3" fill="#e8b880" opacity="0.80"/>
  <rect x="808" y="52"  width="3" height="3" fill="#e8b880" opacity="0.80"/>

  <!-- ═══════════════════════════════════════════════
       HEADER ROW  (top-left branding + top-right label)
  ═══════════════════════════════════════════════ -->
  <text x="22" y="26"
        font-family="'Courier New',Courier,monospace"
        font-size="12" font-weight="700"
        fill="#CC7A4A" letter-spacing="0.8" opacity="0.90">
    ★  futuretales.ai
  </text>

  <text x="858" y="26"
        font-family="'Courier New',Courier,monospace"
        font-size="12" fill="#CC7A4A" opacity="0.50"
        text-anchor="end" letter-spacing="0.5">
    Certified Architect Study Guide
  </text>

  <!-- ═══════════════════════════════════════════════
       MAIN TITLE  —  bold monospace, pixel-terminal feel
       Mimics the chunky pixel font style in the images.
       (Courier New bold at large size reads as near-pixel.)
  ═══════════════════════════════════════════════ -->

  <!-- "CLAUDE" — very large, dominant, glowing -->
  <text x="24" y="118"
        font-family="'Courier New',Courier,monospace"
        font-size="84" font-weight="900"
        fill="#CC7A4A"
        stroke="#CC7A4A" stroke-width="2"
        paint-order="stroke fill"
        letter-spacing="6"
        filter="url(#og)">CLAUDE</text>

  <!-- "CERTIFIED" -->
  <text x="24" y="172"
        font-family="'Courier New',Courier,monospace"
        font-size="46" font-weight="900"
        fill="#CC7A4A"
        stroke="#CC7A4A" stroke-width="1"
        paint-order="stroke fill"
        letter-spacing="8">CERTIFIED</text>

  <!-- "ARCHITECT" -->
  <text x="24" y="218"
        font-family="'Courier New',Courier,monospace"
        font-size="46" font-weight="900"
        fill="#CC7A4A"
        stroke="#CC7A4A" stroke-width="1"
        paint-order="stroke fill"
        letter-spacing="8">ARCHITECT</text>

  <!-- ═══════════════════════════════════════════════
       FOOTER ROW  (terminal prompt, like Image 3 bottom)
  ═══════════════════════════════════════════════ -->
  <text x="22" y="278"
        font-family="'Courier New',Courier,monospace"
        font-size="12" fill="#CC7A4A" opacity="0.68" letter-spacing="0.5">
    ▶  Foundations · 28 Task Statements · 6 Scenarios · 52 Practice Questions
  </text>
  <!-- blinking cursor block (static) -->
  <rect x="580" y="265" width="8" height="14" fill="#CC7A4A" opacity="0.70"/>

  <!-- ═══════════════════════════════════════════════
       PIXEL ART CLAUDE MASCOT  (right side, Image 4 style)
       Grid: 10 cols × 15 rows, pixel_size = 10px
       Base: translate(668, 100)  →  mascot 100×150px
       Colors:
         body   #C4784C
         shade  #9C5F38  (feet, arms, mouth)
         dark   #1a0d07  (eyes)
         hi     #e8b070  (eye highlight)
  ═══════════════════════════════════════════════ -->

  <g transform="translate(668,100)" filter="url(#ogsm)">

    <!-- ROW 0  cols 2-7 -->
    <rect x="20"  y="0"  width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="0"  width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="0"  width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="0"  width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="0"  width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="0"  width="10" height="10" fill="#C4784C"/>

    <!-- ROW 1  cols 1-8 -->
    <rect x="10"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="10" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="10" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 2  cols 0-9  (full width) -->
    <rect x="0"   y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="20" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="20" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 3  eyes at cols 2-3 and 6-7, rest body -->
    <rect x="0"   y="30" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="30" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="30" width="10" height="10" fill="#1a0d07"/><!-- L eye -->
    <rect x="30"  y="30" width="10" height="10" fill="#1a0d07"/><!-- L eye -->
    <rect x="40"  y="30" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="30" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="30" width="10" height="10" fill="#1a0d07"/><!-- R eye -->
    <rect x="70"  y="30" width="10" height="10" fill="#1a0d07"/><!-- R eye -->
    <rect x="80"  y="30" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="30" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 4  same eye pattern -->
    <rect x="0"   y="40" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="40" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="40" width="10" height="10" fill="#1a0d07"/>
    <rect x="30"  y="40" width="10" height="10" fill="#1a0d07"/>
    <rect x="40"  y="40" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="40" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="40" width="10" height="10" fill="#1a0d07"/>
    <rect x="70"  y="40" width="10" height="10" fill="#1a0d07"/>
    <rect x="80"  y="40" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="40" width="10" height="10" fill="#C4784C"/>

    <!-- Eye highlights (small bright pixel top-left of each eye) -->
    <rect x="21"  y="31" width="4" height="4" fill="#e8b070" opacity="0.50"/>
    <rect x="61"  y="31" width="4" height="4" fill="#e8b070" opacity="0.50"/>

    <!-- ROW 5  full body -->
    <rect x="0"   y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="50" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="50" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 6  mouth at cols 3-6 shade, rest body -->
    <rect x="0"   y="60" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="60" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="60" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="60" width="10" height="10" fill="#9C5F38"/><!-- mouth -->
    <rect x="40"  y="60" width="10" height="10" fill="#9C5F38"/>
    <rect x="50"  y="60" width="10" height="10" fill="#9C5F38"/>
    <rect x="60"  y="60" width="10" height="10" fill="#9C5F38"/>
    <rect x="70"  y="60" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="60" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="60" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 7  full body -->
    <rect x="0"   y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="10"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="70" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="70" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 8  arm nubs at cols 0 and 9 (shade), body 1-8 -->
    <rect x="0"   y="80" width="10" height="10" fill="#9C5F38"/><!-- arm L -->
    <rect x="10"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="80" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="80" width="10" height="10" fill="#9C5F38"/><!-- arm R -->

    <!-- ROW 9  same arm pattern -->
    <rect x="0"   y="90" width="10" height="10" fill="#9C5F38"/>
    <rect x="10"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="90" width="10" height="10" fill="#C4784C"/>
    <rect x="90"  y="90" width="10" height="10" fill="#9C5F38"/>

    <!-- ROW 10  cols 1-8 body -->
    <rect x="10"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="100" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="100" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 11  cols 1-8 body -->
    <rect x="10"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="20"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="30"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="40"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="50"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="60"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="70"  y="110" width="10" height="10" fill="#C4784C"/>
    <rect x="80"  y="110" width="10" height="10" fill="#C4784C"/>

    <!-- ROW 12–14  feet at cols 2-3 and 6-7 -->
    <rect x="20"  y="120" width="10" height="10" fill="#9C5F38"/>
    <rect x="30"  y="120" width="10" height="10" fill="#9C5F38"/>
    <rect x="60"  y="120" width="10" height="10" fill="#9C5F38"/>
    <rect x="70"  y="120" width="10" height="10" fill="#9C5F38"/>

    <rect x="20"  y="130" width="10" height="10" fill="#9C5F38"/>
    <rect x="30"  y="130" width="10" height="10" fill="#9C5F38"/>
    <rect x="60"  y="130" width="10" height="10" fill="#9C5F38"/>
    <rect x="70"  y="130" width="10" height="10" fill="#9C5F38"/>

    <rect x="20"  y="140" width="10" height="10" fill="#9C5F38"/>
    <rect x="30"  y="140" width="10" height="10" fill="#9C5F38"/>
    <rect x="60"  y="140" width="10" height="10" fill="#9C5F38"/>
    <rect x="70"  y="140" width="10" height="10" fill="#9C5F38"/>

  </g>

  <!-- Ground line (Image 4 style) -->
  <line x1="600" y1="256" x2="858" y2="256"
        stroke="#CC7A4A" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- FUTURE TALES label + URL (below mascot, retro terminal style) -->
  <text x="718" y="271"
        font-family="'Courier New',Courier,monospace"
        font-size="11" font-weight="700"
        fill="#CC7A4A" text-anchor="middle"
        letter-spacing="3" opacity="0.80">FUTURE TALES</text>
  <text x="718" y="286"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#CC7A4A" text-anchor="middle"
        letter-spacing="1" opacity="0.45">futuretales.ai</text>

  <!-- Small diamond pixel decorations (like Image 3) -->
  <g fill="#CC7A4A">
    <!-- left zone -->
    <rect x="550" y="100" width="5" height="5" opacity="0.22"
          transform="rotate(45,552,102)"/>
    <rect x="552" y="180" width="4" height="4" opacity="0.18"
          transform="rotate(45,554,182)"/>
    <rect x="548" y="220" width="5" height="5" opacity="0.20"
          transform="rotate(45,550,222)"/>
    <!-- right zone -->
    <rect x="820" y="90"  width="5" height="5" opacity="0.22"
          transform="rotate(45,822,92)"/>
    <rect x="840" y="190" width="4" height="4" opacity="0.18"
          transform="rotate(45,842,192)"/>
    <rect x="860" y="120" width="5" height="5" opacity="0.20"
          transform="rotate(45,862,122)"/>
  </g>

  <!-- Vertical divider (subtle) -->
  <line x1="590" y1="38" x2="590" y2="258"
        stroke="#CC7A4A" stroke-width="0.5" stroke-opacity="0.15"/>

</svg>
